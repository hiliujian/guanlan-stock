<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>观澜 · 智能股票分析</title>
    <link rel="icon" href="data:," />
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
    <!-- 广告 loader（运行时可配置，改 src/static/ad-config.json 即生效，无需重新编译）。
         Social Bar 广告要求位于 </body> 紧前（body 内最后一行）：此处内联脚本在页面加载时
         fetch 广告配置，enabled=true 才动态注入 <script src="url">——由于注入的脚本不带
         async/defer，同步执行语义与直接书写在 body 末尾等价，满足广告位要求；
         enabled=false / 配置缺失 / fetch 失败 → 静默不注入。SPA 单页全站共用本 HTML，
         广告脚本仅此一处，严禁重复粘贴。 -->
    <script>
      (function () {
        try {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", "static/ad-config.json", false); // 同步：保证在 </body> 前完成注入
          xhr.send(null);
          if (xhr.status >= 200 && xhr.status < 300) {
            var cfg = JSON.parse(xhr.responseText);
            if (cfg && cfg.enabled && cfg.url) {
              var s = document.createElement("script");
              s.src = cfg.url;
              document.body.appendChild(s);
            }
          }
        } catch (_) {
          /* 配置缺失 / 网络异常：静默无广告 */
        }
      })();
    </script>
  </body>
</html>
